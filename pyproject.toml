# ==========================================================
# Formatting scope
# ==========================================================
#
# All of `src/` and `tests/` is formatted and enforced. Only non-source trees
# are excluded.
#
# This previously excluded 15 of the 17 packages under `src/` plus all of
# `tests/`, so black and isort ran, reported success, and checked almost
# nothing. Retiring that took two passes: 131 files on 2026-09-17 and the
# remaining nine packages immediately after.
#
# NOTE for Windows: run the formatters in UTF-8 mode. 35 files legitimately
# contain characters outside cp1252 - the currency symbols in the classifier's
# regex, emoji in the Streamlit components, box-drawing in a docstring diagram.
# Without `PYTHONUTF8=1`, isort cannot read them and SKIPS them silently, which
# means a file can drift while the check still reports clean. `scripts/lint.ps1`
# sets this; see also `scripts/run_tests.ps1`.
[tool.black]
line-length = 120
target-version = ["py311"]
force-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | docs
  | reports
  | logs
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 120
filter_files = true
skip_glob = [
    ".venv/*",
    "venv/*",
    "docs/*",
    "logs/*",
    "reports/*",
    "data/*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["var-annotated", "union-attr", "arg-type", "return-value", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    "performance",
    "data",
    "venv",
    ".venv",
    ".git",
    "scratch",
    "docs",
]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: requires live external infrastructure (Ollama, REST API). Deselected by default; run with `pytest -m integration`.",
]
