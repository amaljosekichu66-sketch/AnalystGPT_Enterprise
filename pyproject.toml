[tool.black]
line-length = 120
target-version = ["py311"]
force-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | docs
  | reports
  | logs
  | src/(database|reporting|llm|frontend|integrations|ai|persistence|api|application|cleaning|upload|quality|analytics|core)
  | tests
)/
'''

[tool.isort]
profile = "black"
line_length = 120
filter_files = true
skip_glob = [
    ".venv/*",
    "venv/*",
    "docs/*",
    "logs/*",
    "reports/*",
    "src/database/*",
    "src/reporting/*",
    "src/llm/*",
    "src/frontend/*",
    "src/integrations/*",
    "src/ai/*",
    "src/persistence/*",
    "src/api/*",
    "src/application/*",
    "src/cleaning/*",
    "src/upload/*",
    "src/quality/*",
    "src/analytics/*",
    "src/core/*",
    "tests/*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["var-annotated", "union-attr", "arg-type", "return-value", "assignment"]
