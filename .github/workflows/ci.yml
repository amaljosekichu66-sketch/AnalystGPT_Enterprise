name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Job 1: Code Quality & Static Analysis (Strict Blocking)
  # ==========================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8 Syntax & Fatal Errors Gate
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 Style & Standards Gate
        run: |
          flake8 src tests --count --statistics

      - name: Black Formatting Gate
        run: |
          black --check src tests

      - name: Isort Import Ordering Gate
        run: |
          isort --check src tests

      - name: Mypy Static Type Analysis Gate
        run: |
          mypy src

  # ==========================================================
  # Job 2: Automated Test Suite Execution
  # ==========================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite (pytest)
        env:
          PYTHONPATH: .
          DATABASE_ENGINE: sqlite
          LOG_TO_FILE: "false"
        run: |
          pytest tests/ -v

  # ==========================================================
  # Job 3: Docker Multi-Stage Image Builds
  # ==========================================================
  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Target Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          load: true
          tags: analystgpt-api:ci

      - name: Build Frontend Target Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: frontend
          load: true
          tags: analystgpt-frontend:ci

      - name: Build CLI Target Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: cli
          load: true
          tags: analystgpt-cli:ci

  # ==========================================================
  # Job 4: Docker Compose Configuration Validation
  # ==========================================================
  compose-validation:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Schema & Configuration
        run: |
          docker compose config

  # ==========================================================
  # Job 5: Docker Compose End-to-End Integration & Health
  # ==========================================================
  compose-integration:
    name: Compose E2E Integration
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - compose-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Full Multi-Service Stack
        run: |
          docker compose up -d --build

      - name: Wait for PostgreSQL Health
        run: |
          echo "Waiting for PostgreSQL service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-postgres 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "PostgreSQL is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "PostgreSQL failed to become healthy within timeout"
            docker logs analystgpt-postgres
            exit 1
          fi

      - name: Wait for API Health
        run: |
          echo "Waiting for API service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-api 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "API is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "API failed to become healthy within timeout"
            docker logs analystgpt-api
            exit 1
          fi

      - name: Wait for Frontend Health
        run: |
          echo "Waiting for Frontend service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-frontend 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "Frontend is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "Frontend failed to become healthy within timeout"
            docker logs analystgpt-frontend
            exit 1
          fi

      - name: Verify API Health Endpoint via HTTP
        run: |
          echo "Testing API health endpoint on host port 8000..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health)
          if [ "$response" -ne 200 ]; then
            echo "API health check failed with HTTP status: $response"
            docker logs analystgpt-api
            exit 1
          fi
          echo "API health endpoint responded with HTTP 200 OK!"

      - name: Verify Frontend Health Endpoint via HTTP
        run: |
          echo "Testing Streamlit health endpoint on host port 8501..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/_stcore/health)
          if [ "$response" -ne 200 ]; then
            echo "Frontend health check failed with HTTP status: $response"
            docker logs analystgpt-frontend
            exit 1
          fi
          echo "Frontend health endpoint responded with HTTP 200 OK!"

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v
