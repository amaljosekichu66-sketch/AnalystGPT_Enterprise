name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (SEC-22): every job only needs to read the repository.
permissions:
  contents: read

jobs:

  # ==========================================================
  # Job 1: Code Quality & Static Analysis (Strict Blocking)
  # ==========================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Flake8 Syntax & Fatal Errors Gate
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 Style & Standards Gate
        run: |
          flake8 src tests --count --statistics

      - name: Black Formatting Gate
        run: |
          black --check src tests

      - name: Isort Import Ordering Gate
        run: |
          isort --check src tests

      - name: Mypy Static Type Analysis Gate
        run: |
          mypy src

  # ==========================================================
  # Job 1b: Security Scanning (SEC-22)
  # ==========================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Scanners
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.8.0" "pip-audit>=2.9.0"

      - name: Secret Scan (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

      - name: Dependency Vulnerability Audit (pip-audit, runtime lock)
        run: |
          pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Static Security Analysis (bandit, fails on HIGH)
        # 49 MEDIUM B608 findings were reviewed as false positives (last on
        # 2026-09-30): only table-name constants, enum values and fixed column
        # names are interpolated into SQL, and all values are bound
        # parameters. HIGH findings fail the build.
        run: |
          bandit -r src scripts -q --severity-level high

  # ==========================================================
  # Job 2: Automated Test Suite Execution
  # ==========================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs:
      - quality
      - security

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Full Test Suite (pytest)
        env:
          PYTHONPATH: .
          DATABASE_ENGINE: sqlite
          LOG_TO_FILE: "false"
        run: |
          pytest tests/ -v

  # ==========================================================
  # Job 3: Docker Multi-Stage Image Builds
  # ==========================================================
  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API Target Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: api
          load: true
          tags: analystgpt-api:ci

      - name: Build Frontend Target Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: frontend
          load: true
          tags: analystgpt-frontend:ci

      - name: Build CLI Target Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: cli
          load: true
          tags: analystgpt-cli:ci

      - name: Container Image Scan (trivy, fails on fixable HIGH/CRITICAL)
        # I12: the built images and the pinned PostgreSQL image, OS and Python
        # packages. Trivy 0.74.0, pinned by digest like gitleaks above. Only
        # vulnerabilities with a released fix fail the build.
        run: |
          for image in analystgpt-api:ci analystgpt-frontend:ci analystgpt-cli:ci               postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock               aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969               image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image"
          done

  # ==========================================================
  # Job 4: Docker Compose Configuration Validation
  # ==========================================================
  compose-validation:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate Ephemeral Secrets
        run: |
          key=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          pg=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          app=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "::add-mask::$key"
          echo "::add-mask::$pg"
          echo "::add-mask::$app"
          echo "AUTH_SECRET_KEY=$key" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$pg" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$app" >> "$GITHUB_ENV"

      - name: Validate Docker Compose Schema & Configuration
        run: |
          docker compose config --quiet

  # ==========================================================
  # Job 5: Docker Compose End-to-End Integration & Health
  # ==========================================================
  compose-integration:
    name: Compose E2E Integration
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - compose-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate Ephemeral Secrets
        run: |
          key=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          pg=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          app=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "::add-mask::$key"
          echo "::add-mask::$pg"
          echo "::add-mask::$app"
          echo "AUTH_SECRET_KEY=$key" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$pg" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$app" >> "$GITHUB_ENV"

      - name: Start Full Multi-Service Stack
        run: |
          docker compose up -d --build

      - name: Wait for PostgreSQL Health
        run: |
          echo "Waiting for PostgreSQL service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-postgres 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "PostgreSQL is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "PostgreSQL failed to become healthy within timeout"
            docker logs analystgpt-postgres
            exit 1
          fi

      - name: Wait for API Health
        run: |
          echo "Waiting for API service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-api 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "API is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "API failed to become healthy within timeout"
            docker logs analystgpt-api
            exit 1
          fi

      - name: Wait for Frontend Health
        run: |
          echo "Waiting for Frontend service to become healthy..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' analystgpt-frontend 2>/dev/null || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "Frontend is healthy!"
              break
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          if [ $timeout -le 0 ]; then
            echo "Frontend failed to become healthy within timeout"
            docker logs analystgpt-frontend
            exit 1
          fi

      - name: Verify API Health Endpoint via HTTP
        run: |
          echo "Testing API health endpoint on host port 8000..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health)
          if [ "$response" -ne 200 ]; then
            echo "API health check failed with HTTP status: $response"
            docker logs analystgpt-api
            exit 1
          fi
          echo "API health endpoint responded with HTTP 200 OK!"

      - name: Verify Frontend Health Endpoint via HTTP
        run: |
          echo "Testing Streamlit health endpoint on host port 8501..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/_stcore/health)
          if [ "$response" -ne 200 ]; then
            echo "Frontend health check failed with HTTP status: $response"
            docker logs analystgpt-frontend
            exit 1
          fi
          echo "Frontend health endpoint responded with HTTP 200 OK!"

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v
