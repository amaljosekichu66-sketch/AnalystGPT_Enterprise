# ==========================================================
# AnalystGPT Enterprise — Docker Compose Multi-Service Topology
#
# Services:
# - postgres: PostgreSQL 16 relational database
# - api: FastAPI backend REST service (target: api)
# - frontend: Streamlit enterprise user interface (target: frontend)
# ==========================================================

services:

  # --------------------------------------------------------
  # 1. PostgreSQL Database Service
  # --------------------------------------------------------
  postgres:
    # Pinned by digest (L19): a tag can be re-pointed upstream. Resolved from
    # Docker Hub on 2026-09-30 (multi-arch index of postgres:16-alpine).
    # Refresh deliberately, the same way as the python base image.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: analystgpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-analystgpt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      # Least-privilege role the API connects as (L19), created on first init
      # by docker/postgres/init-app-role.sh. The superuser above is for
      # administration only and is not given to the API.
      APP_DB_USER: ${APP_DB_USER:-analystgpt_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks:
      - analystgpt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-analystgpt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------
  # 2. FastAPI Backend REST API Service
  # --------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: analystgpt-api
    restart: unless-stopped
    # Published on loopback only by default (SEC-17): the frontend reaches the
    # API over the compose network, and outside clients should come through a
    # TLS-terminating reverse proxy. Set API_BIND_ADDRESS=0.0.0.0 to publish.
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      # Security posture. Production refuses the built-in signing key, empty
      # or short keys, and unauthenticated identity headers. AUTH_SECRET_KEY
      # has NO default: `docker compose` fails fast if it is not provided
      # (via the shell or a .env file next to this compose file).
      APP_ENVIRONMENT: production
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set to a private random value of at least 32 characters (see .env.example)}

      # Rate limits and lockouts are per client address (M11). Believe the
      # forwarded browser address only from the frontend container (and from
      # your reverse proxy, if you add its address here).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-${ANALYSTGPT_FRONTEND_IP:-172.28.0.10}}

      # Database Connection (Routed to internal postgres service)
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-analystgpt}
      # The application role, not the superuser (L19).
      POSTGRES_USER: ${APP_DB_USER:-analystgpt_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set (see .env.example)}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}

      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-logs/analystgpt.log}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}

      # AI / Ollama Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Plain HTTP to a non-local Ollama is refused unless acknowledged (L11).
      OLLAMA_ALLOW_INSECURE: ${OLLAMA_ALLOW_INSECURE:-false}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_TOP_P: ${AI_TOP_P:-0.90}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-4096}
      AI_TIMEOUT: ${AI_TIMEOUT:-120}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - reports_data:/app/reports
      - logs_data:/app/logs
      # Managed upload store: clients upload bytes to POST /api/datasets and
      # reference them by dataset_version_id, so the stored artifacts must
      # outlive the container.
      - artifacts_data:/app/data/artifacts
    networks:
      - analystgpt-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------
  # 3. Streamlit Frontend UI Service
  # --------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: analystgpt-frontend
    restart: unless-stopped
    # Loopback by default; put a TLS reverse proxy in front, or set
    # FRONTEND_BIND_ADDRESS=0.0.0.0 to publish directly.
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8501}:8501"
    environment:
      # The frontend never signs or verifies tokens, so it does not receive
      # AUTH_SECRET_KEY.
      APP_ENVIRONMENT: production

      # Inter-Service API Routing via Docker DNS
      API_BASE_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      analystgpt-network:
        # Fixed so the API can trust exactly this peer's X-Forwarded-For (M11).
        ipv4_address: ${ANALYSTGPT_FRONTEND_IP:-172.28.0.10}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

# ==========================================================
# Persistent Named Volumes
# ==========================================================
volumes:
  postgres_data:
    name: analystgpt_postgres_data
  reports_data:
    name: analystgpt_reports_data
  logs_data:
    name: analystgpt_logs_data
  artifacts_data:
    name: analystgpt_artifacts_data

# ==========================================================
# Bridge Network
# ==========================================================
networks:
  analystgpt-network:
    name: analystgpt_network
    driver: bridge
    # Fixed subnet so the frontend has a stable address (M11). Override
    # ANALYSTGPT_SUBNET and ANALYSTGPT_FRONTEND_IP if it clashes with a
    # network on the host.
    ipam:
      config:
        - subnet: ${ANALYSTGPT_SUBNET:-172.28.0.0/24}
